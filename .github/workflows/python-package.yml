# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
  pull_request:
  schedule:
    - cron: '30 4 * * 1' # Every Monday @ 4h30am UTC

jobs:
   check_skip:
    runs-on: ubuntu-latest
    if: |
      !contains(format('{0} {1} {2}', github.event.head_commit.message, github.event.pull_request.title, github.event.pull_request.body), '[skip ci]')
    steps:
      - run: |
          cat <<'MESSAGE'
          github.event_name: ${{ toJson(github.event_name) }}
          github.event:
          ${{ toJson(github.event) }}
          MESSAGE
   lint:
    needs: check_skip
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Lint with ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        ruff check .
        ruff format --check .
   test:
    needs: check_skip
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Test
      run: |
        eidos -d 0.5 -r 0.015625 -f 856 956 30 -P mk.holo.lband -o8
    - name: Test Stokes output
      run: |
        eidos -d 0.5 -r 0.015625 -f 1070 -S I -P mk.holo.stokes
        eidos -d 0.5 -r 0.015625 -f 1070 -S M -P mk.holo.mueller
    - name: Test FITS beam centre (CRPIX matches the reconstruction grid)
      run: |
        pip install pytest
        python -m pytest -q tests
